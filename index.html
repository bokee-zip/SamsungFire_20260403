<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼성화재 GEO 도입 전략 제안</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main id="main-content">
        <div data-include="sections/hero_overview.html"></div>
        <div data-include="sections/why_geo.html"></div>
        <div data-include="sections/paradigm_departments.html"></div>
        <div data-include="sections/remaining.html"></div>
    </main>

    <script type="module">
        async function loadSections() {
            const includes = document.querySelectorAll('[data-include]');
            for (const el of includes) {
                const url = el.getAttribute('data-include');
                const res = await fetch(url);
                el.insertAdjacentHTML('afterend', await res.text());
                el.remove();
            }

            const script = document.createElement('script');
            script.src = 'js/script.js';
            document.body.appendChild(script);
        }

        loadSections();
    </script>
</body>
</html>
